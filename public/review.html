<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave a Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f4f6;
            font-family: sans-serif;
        }
        .review-container {
            background: white;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        .stars {
            font-size: 2.5rem;
            color: #d1d5db;
            cursor: pointer;
        }
        .stars > span:hover,
        .stars > span.selected {
            color: #f59e0b;
        }
        #feedback-form, #google-link {
            display: none;
        }
    </style>
</head>
<body>
    <div class="review-container">
        <h2 id="business-name">Leave a review for...</h2>
        <p>How was your experience?</p>
        <div class="stars" id="rating-stars">
            <span data-value="1">★</span><span data-value="2">★</span><span data-value="3">★</span><span data-value="4">★</span><span data-value="5">★</span>
        </div>
        
        <div id="feedback-form" class="mt-4">
            <form>
                <div class="mb-3">
                    <label for="feedback-text" class="form-label">We're sorry to hear that. Please let us know how we can improve:</label>
                    <textarea class="form-control" id="feedback-text" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Submit Feedback</button>
            </form>
        </div>

        <div id="google-link" class="mt-4">
             <p>Thanks for the positive feedback! Please share your experience on Google.</p>
            <a href="#" id="google-review-btn" class="btn btn-warning">Rate us on Google</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        // Your web app's Firebase configuration
        const firebaseConfig = {
          apiKey: "YOUR_API_KEY",
          authDomain: "YOUR_AUTH_DOMAIN",
          projectId: "YOUR_PROJECT_ID",
          storageBucket: "YOUR_STORAGE_BUCKET",
          messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
          appId: "YOUR_APP_ID"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const customerId = urlParams.get('uid');
        
        const stars = document.querySelectorAll('#rating-stars span');
        const feedbackForm = document.getElementById('feedback-form');
        const googleLink = document.getElementById('google-link');
        const businessNameEl = document.getElementById('business-name');

        if (!customerId) {
            businessNameEl.textContent = "Invalid Review Link";
            return;
        }

        const customerRef = doc(db, "customers", customerId);

        // Fetch customer data to get business name
        getDoc(customerRef).then(docSnap => {
            if (docSnap.exists()) {
                const businessId = docSnap.data().businessId;
                // You would typically fetch the business name from a 'businesses' collection
                // For now, we'll just say "our business"
                businessNameEl.textContent = `Leave a review for our business`; 
            }
        });

        stars.forEach(star => {
            star.addEventListener('click', () => {
                const rating = parseInt(star.getAttribute('data-value'));
                
                // Highlight stars
                stars.forEach(s => {
                    s.classList.toggle('selected', parseInt(s.getAttribute('data-value')) <= rating);
                });

                if (rating <= 3) {
                    feedbackForm.style.display = 'block';
                    googleLink.style.display = 'none';
                } else {
                    feedbackForm.style.display = 'none';
                    googleLink.style.display = 'block';
                }
            });
        });

        feedbackForm.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const feedbackText = document.getElementById('feedback-text').value;
            
            try {
                await updateDoc(customerRef, {
                    internalFeedback: feedbackText,
                    status: "Negative Feedback Received"
                });
                document.querySelector('.review-container').innerHTML = '<h2>Thank you for your feedback.</h2><p>We'll use it to improve our service.</p>';
            } catch (error) {
                console.error("Error submitting feedback:", error);
                alert("There was an error submitting your feedback. Please try again.");
            }
        });

        document.getElementById('google-review-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await updateDoc(customerRef, {
                    status: "Clicked Google Link"
                });
                // In a real app, you would get this from the business's profile
                window.location.href = "https://www.google.com/search?q=google+reviews"; 
            } catch (error) {
                console.error("Error updating status:", error);
                // Still redirect
                 window.location.href = "https://www.google.com/search?q=google+reviews";
            }
        });

    </script>
</body>
</html>
