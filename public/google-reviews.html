<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Reviews | ReviewResQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar"></aside>
        <main class="main">
            <header class="top-header">
                <button class="topbar-toggler">☰</button>
                 <div class="header-actions">
                     <button id="sync-google-btn" class="btn btn-primary btn-sm">
                         <i class="fas fa-sync-alt me-1"></i> Sync with Google
                     </button>
                 </div>
            </header>
            <div class="main-content">
                <!-- Connection Hub -->
                <div class="card border-0 shadow-sm mb-4" id="google-connection-hub">
                    <!-- Disconnected State -->
                    <div id="disconnected-view" class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <div class="d-flex align-items-center">
                                <i class="fab fa-google-business fa-3x text-muted me-3"></i>
                                <div>
                                    <h5 class="mb-0">Google Business Profile</h5>
                                    <p class="mb-0 text-muted">Connect your business to fetch reviews and insights.</p>
                                </div>
                            </div>
                        </div>
                        <button id="connect-gbp-btn" class="btn btn-primary">Connect Google Business Profile</button>
                    </div>

                    <!-- Connected State -->
                    <div id="connected-view" class="card-body d-flex justify-content-between align-items-center d-none">
                        <div>
                            <div class="d-flex align-items-center">
                                <img id="user-avatar" src="" class="rounded-circle me-3" style="width: 48px; height: 48px;">
                                <div>
                                    <h5 class="mb-0">Connected as: <span id="business-name"></span></h5>
                                    <p class="mb-0 text-muted" id="user-email"></p>
                                </div>
                            </div>
                        </div>
                        <button id="disconnect-gbp-btn" class="btn btn-outline-danger">Disconnect / Change Account</button>
                    </div>
                </div>
                <div id="google-reviews-content">
                    <!-- ROI Stats will be rendered here by JS -->
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="dashboard-nav.js"></script>
    <script type="module" src="google-reviews.js"></script>
</body>
</html>
