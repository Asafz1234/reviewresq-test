<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers | ReviewResQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard.css">
    
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        .dashboard-container { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
        .sidebar {
            width: 260px; background-color: #111827; color: white; flex-shrink: 0;
            display: flex; flex-direction: column; border-right: 1px solid #374151;
        }
        .sidebar-header { padding: 20px; font-size: 1.25rem; font-weight: bold; border-bottom: 1px solid #1f2937; }
        .nav-links { list-style: none; padding: 0; margin: 20px 0; flex-grow: 1; }
        .nav-link {
            display: flex; align-items: center; gap: 12px; padding: 12px 20px;
            color: #9ca3af; text-decoration: none; transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active { background-color: #1f2937; color: white; border-left: 4px solid #3b82f6; }
        .nav-icon { width: 20px; text-align: center; }
        .topbar {
            height: 64px; background: white; border-bottom: 1px solid #e5e7eb;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; flex-shrink: 0;
        }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; background: #f3f4f6; }
        .content-scroll { flex-grow: 1; overflow-y: auto; padding: 24px; }
        .empty-state {
            text-align: center; padding: 60px 20px; background: #fff;
            border-radius: 8px; border: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        
        <aside class="sidebar">
            <div class="sidebar-header"><i class="fas fa-star text-primary me-2"></i>ReviewResQ</div>
            <ul class="nav-links">
                <li class="nav-item"><a href="/overview" class="nav-link"><i class="fas fa-home nav-icon"></i> Overview</a></li>
                <li class="nav-item"><a href="/ask-reviews" class="nav-link"><i class="fas fa-paper-plane nav-icon"></i> Ask for Reviews</a></li>
                <li class="nav-item"><a href="/customer-feedback" class="nav-link"><i class="fas fa-comments nav-icon"></i> Customer Feedback</a></li>
                <li class="nav-item"><a href="/google-reviews" class="nav-link"><i class="fas fa-star nav-icon"></i> Google Reviews</a></li>
                <li class="nav-item"><a href="/customers" class="nav-link active"><i class="fas fa-users nav-icon"></i> Customers</a></li>
                <li class="nav-item"><a href="/review-funnel" class="nav-link"><i class="fas fa-filter nav-icon"></i> Review Funnel</a></li>
                <li class="nav-item"><a href="/settings" class="nav-link"><i class="fas fa-cog nav-icon"></i> Settings</a></li>
            </ul>
        </aside>

        <div class="main-content">
            <header class="topbar">
                <h4 class="fw-bold mb-0">Customer Management</h4>
                <div class="d-flex align-items-center gap-3">
                    <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-pill">Starter Plan</span>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCustomerModal">
                        <i class="fas fa-plus me-1"></i> Add New Customer
                    </button>
                </div>
            </header>
            
            <div class="content-scroll">
                <div id="customers-content">
                    <!-- This will be populated by customers.js -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add Customer Modal -->
    <div class="modal fade" id="addCustomerModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add a New Customer</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-customer-form">
                        <div class="mb-3">
                            <label for="customerName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="customerName" required>
                        </div>
                        <div class="mb-3">
                            <label for="customerEmail" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="customerEmail">
                        </div>
                        <div class="mb-3">
                            <label for="customerPhone" class="form-label">Phone Number (Optional)</label>
                            <input type="tel" class="form-control" id="customerPhone">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" form="add-customer-form">Save Customer</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="customers.js"></script>
</body>
</html>
