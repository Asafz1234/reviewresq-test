<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReviewResQ - Feedback</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"></aside>
    <main class="main">
      <header class="top-header">
        <button class="topbar-toggler">☰</button>
        <div class="header-actions">
          <button id="refresh-insights-btn" class="btn">Refresh Insights</button>
          <div class="plan-label">Starter Plan</div>
        </div>
      </header>
      
      <div class="main-content">
        <div class="page-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
          <div>
            <h1 style="font-size: 24px; font-weight: 700; margin: 0;">Customer Feedback</h1>
            <p style="color: var(--rr-text-sub); margin: 4px 0 0;">Manage and respond to incoming reviews.</p>
          </div>
          <div class="table-controls" style="display:flex; gap:12px;">
             <select id="rating-filter" class="btn" style="background:#fff; border:1px solid #e5e7eb; font-weight:400;">
                <option value="all">All Ratings</option>
                <option value="5">5 Stars</option>
                <option value="4">4 Stars</option>
                <option value="3">3 Stars</option>
                <option value="2">2 Stars</option>
                <option value="1">1 Star</option>
             </select>
             <input type="text" id="search-feedback" placeholder="Search customer..." style="padding:10px; border:1px solid #e5e7eb; border-radius:8px; font-size:14px;">
          </div>
        </div>

        <div class="card">
            <div class="table-wrapper">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Customer</th>
                            <th>Rating</th>
                            <th>Message</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="feedback-table-body"></tbody>
                </table>
            </div>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="dashboard-nav.js"></script>
  <script type="module" src="feedback-logic.js"></script> 
</body>
</html>
