<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team & Roles - ReviewResQ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="nav-access-init.js"></script>
  <script type="module" src="session-data.js"></script>
  <script src="dashboard-nav.js" defer></script>
</head>
<body class="bg-gray-50 text-slate-900 font-sans antialiased">
  <div class="flex h-screen overflow-hidden">
    <aside class="w-64 flex-shrink-0 border-r border-slate-200 bg-white h-full fixed left-0 top-0 overflow-y-auto z-10">
      <div class="p-6">
        <div class="text-2xl font-bold text-blue-600 tracking-tight">ReviewResQ</div>
      </div>
      <nav class="global-nav mt-2 px-4 space-y-1"></nav>

    <main class="flex-1 ml-64 h-full overflow-y-auto">
      <header class="bg-white border-b border-slate-200 px-8 py-5 flex items-center justify-between sticky top-0 z-10">
        <h1 class="text-xl font-bold text-slate-900">Team & Roles</h1>
        <div class="flex items-center gap-4">
           <span id="user-plan-badge" class="invisible px-3 py-1 rounded-full bg-blue-100 text-blue-700 text-xs font-semibold uppercase tracking-wider">Loading...</span>
        </div>
      </header>
      <div class="p-8 max-w-5xl mx-auto">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-12 text-center">
            <div class="text-6xl mb-4">👥</div>
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Team Management</h2>
            <p class="text-slate-500 max-w-md mx-auto">Manage team members and access permissions.</p>
        </div>
      </div>
