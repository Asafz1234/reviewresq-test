<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReviewResQ - The Future of Customer Reputation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0B0F19; color: white; }
        .gradient-text {
            background: linear-gradient(to right, #ffffff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
   <style>
     .btn-signup, .nav-cta, a[href*="signup"] { display: none !important; }
   </style>
</head>
<body class="bg-[#0B0F19] text-white h-screen flex flex-col">

    <nav class="border-b border-gray-800 bg-[#0B0F19]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 w-8 h-8 rounded flex items-center justify-center shrink-0">
                        <i class="fas fa-star text-white text-xs">R</i>
                    </div>
                    <span class="text-xl font-bold tracking-tight">ReviewResQ</span>
                </div>
                <div class="flex items-center gap-4">
                    <button class="login-btn text-gray-300 hover:text-white font-medium text-sm">Login</button>
                    <button class="login-btn bg-blue-600 text-white px-5 py-2.5 rounded-lg hover:bg-blue-700 font-medium text-sm">Start Free Trial</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center relative overflow-hidden px-4">
        <div class="relative max-w-4xl mx-auto text-center z-10">
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-6 leading-tight">
                The Future of <br />
                <span class="gradient-text">Customer Reputation</span>
            </h1>
            <p class="mt-4 text-xl text-gray-400 max-w-2xl mx-auto mb-10">
                Turn customer feedback into your most powerful growth engine.
            </p>
            <div class="flex justify-center gap-4">
                <button class="login-btn bg-white text-black px-8 py-4 rounded-lg font-bold hover:bg-gray-100">Get Started Free</button>
            </div>
        </div>
    </main>

    <div id="auth-modal" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-900 bg-opacity-75 transition-opacity" aria-hidden="true" id="modal-backdrop"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            
            <div class="inline-block align-bottom bg-gray-900 rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-md sm:w-full border border-gray-700">
                <div class="px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-2xl leading-6 font-bold text-white mb-4" id="modal-title">Welcome Back</h3>
                            
                            <div id="auth-error" class="hidden bg-red-900/50 border border-red-500 text-red-200 px-4 py-2 rounded mb-4 text-sm"></div>

                            <div class="flex space-x-4 border-b border-gray-700 mb-6">
                                <button id="tab-login" class="pb-2 text-blue-500 border-b-2 border-blue-500 font-medium text-sm focus:outline-none">Log In</button>
                                <button id="tab-signup" class="pb-2 text-gray-400 font-medium text-sm hover:text-gray-200 focus:outline-none">Sign Up</button>
                            </div>

                            <form id="auth-form" class="space-y-4">
                                <div>
                                    <label for="email" class="block text-sm font-medium text-gray-300">Email address</label>
                                    <input type="email" id="email" required class="mt-1 block w-full bg-gray-800 border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                                </div>
                                <div>
                                    <div class="flex justify-between">
                                        <label for="password" class="block text-sm font-medium text-gray-300">Password</label>
                                        <a href="#" id="forgot-password" class="text-sm text-blue-400 hover:text-blue-300">Forgot password?</a>
                                    </div>
                                    <input type="password" id="password" required class="mt-1 block w-full bg-gray-800 border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                                </div>
                                <button type="submit" id="submit-btn" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                                    Sign In
                                </button>
                            </form>

                            <div class="relative my-6">
                                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-600"></div></div>
                                <div class="relative flex justify-center text-sm"><span class="px-2 bg-gray-900 text-gray-400">Or continue with</span></div>
                            </div>

                            <button id="google-btn" class="w-full flex justify-center items-center py-2 px-4 border border-gray-600 rounded-md shadow-sm text-sm font-medium text-white bg-gray-800 hover:bg-gray-700 focus:outline-none">
                                <img class="h-5 w-5 mr-2" src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                                Google
                            </button>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-800 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" id="close-modal" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-600 shadow-sm px-4 py-2 bg-transparent text-base font-medium text-gray-300 hover:text-white focus:outline-none sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            sendPasswordResetEmail,
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { firebaseConfig } from '/firebase-config.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- DOM Elements ---
        const modal = document.getElementById('auth-modal');
        const modalTitle = document.getElementById('modal-title');
        const form = document.getElementById('auth-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-btn');
        const googleBtn = document.getElementById('google-btn');
        const authError = document.getElementById('auth-error');
        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');
        const forgotPass = document.getElementById('forgot-password');
        
        let isLoginMode = true;

        // --- Auth State ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = '/dashboard.html';
            }
        });

        // --- Modal Control ---
        const openModal = () => modal.classList.remove('hidden');
        const closeModal = () => modal.classList.add('hidden');
        
        document.querySelectorAll('.login-trigger, .login-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                openModal();
            });
        });
        document.getElementById('close-modal').addEventListener('click', closeModal);
        document.getElementById('modal-backdrop').addEventListener('click', closeModal);

        // --- Switch Tabs ---
        function switchTab(login) {
            isLoginMode = login;
            authError.classList.add('hidden');
            form.reset();
            
            if (login) {
                modalTitle.textContent = "Welcome Back";
                submitBtn.textContent = "Sign In";
                tabLogin.classList.add('text-blue-500', 'border-blue-500');
                tabLogin.classList.remove('text-gray-400');
                tabSignup.classList.remove('text-blue-500', 'border-blue-500');
                tabSignup.classList.add('text-gray-400');
                forgotPass.classList.remove('hidden');
            } else {
                modalTitle.textContent = "Create Account";
                submitBtn.textContent = "Sign Up Free";
                tabSignup.classList.add('text-blue-500', 'border-blue-500');
                tabSignup.classList.remove('text-gray-400');
                tabLogin.classList.remove('text-blue-500', 'border-blue-500');
                tabLogin.classList.add('text-gray-400');
                forgotPass.classList.add('hidden');
            }
        }

        tabLogin.addEventListener('click', () => switchTab(true));
        tabSignup.addEventListener('click', () => switchTab(false));

        // --- Submit Handler ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value;
            const password = passwordInput.value;
            authError.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = "Processing...";

            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                }
                // Redirect happens via onAuthStateChanged
            } catch (error) {
                authError.textContent = error.message.replace('Firebase: ', '');
                authError.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = isLoginMode ? "Sign In" : "Sign Up Free";
            }
        });

        // --- Google Handler ---
        googleBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, new GoogleAuthProvider());
            } catch (error) {
                authError.textContent = error.message;
                authError.classList.remove('hidden');
            }
        });

        // --- Forgot Password ---
        forgotPass.addEventListener('click', async (e) => {
            e.preventDefault();
            const email = emailInput.value;
            if (!email) {
                authError.textContent = "Please enter your email address first.";
                authError.classList.remove('hidden');
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                alert("Password reset email sent to " + email);
            } catch (error) {
                authError.textContent = error.message;
                authError.classList.remove('hidden');
            }
        });
    </script>
    <div id="review-funnel-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
        <div style="max-width:500px; padding:20px;">
            <h1 style="color:#333; margin-bottom:10px;">How was your experience?</h1>
            <p style="color:#666; margin-bottom:30px;">Please rate us to help us improve.</p>
            
            <div style="font-size:50px; cursor:pointer; margin-bottom:30px;">
                <span onclick="handleRating(1)" onmouseover="highlightStars(1)">★</span>
                <span onclick="handleRating(2)" onmouseover="highlightStars(2)">★</span>
                <span onclick="handleRating(3)" onmouseover="highlightStars(3)">★</span>
                <span onclick="handleRating(4)" onmouseover="highlightStars(4)">★</span>
                <span onclick="handleRating(5)" onmouseover="highlightStars(5)">★</span>
            </div>
    
            <div id="internal-feedback-form" style="display:none; text-align:left;">
                <p style="font-weight:bold; color:#d9534f;">We're sorry to hear that. What went wrong?</p>
                <textarea id="feedback-text" style="width:100%; height:100px; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:5px;"></textarea>
                <button onclick="submitInternalFeedback()" style="width:100%; padding:10px; background:#333; color:white; border:none; border-radius:5px;">Send Feedback</button>
            </div>
        </div>
    </div>

        // 1. Check if user came from email (URL params)
        window.onload = function() {

            if (businessId) {
                // HIDE LOGIN, SHOW FUNNEL
                document.body.children[0].style.display = 'none'; // Hide main site wrapper (assuming it's first)
                document.getElementById('review-funnel-overlay').style.display = 'flex';
            }
        };
    
        // 2. Star Logic
        function handleRating(stars) {
            if (stars >= 4) {
                // POSITIVE: Redirect to Google (Placeholder for now)
                alert("Redirecting to Google Reviews... (This will be dynamic later)");
                // window.location.href = "https://g.page/YOUR_BUSINESS_LINK"; 
            } else {
                // NEGATIVE: Show internal form
                document.getElementById('internal-feedback-form').style.display = 'block';
            }

        // 3. Simple Star Highlight Visuals
        function highlightStars(count) {
            // (Optional: visual logic to color stars gold on hover)
        }
    </script>
</body>
</html>
