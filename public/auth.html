<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReviewResQ – Login or Create account</title>
  <meta
    name="description"
    content="Log in or create your ReviewResQ account to protect your Google rating automatically."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />
  <link rel="icon" href="/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0A0A0A;
    }
    .mesh-gradient {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: -1;
      opacity: 0.25;
      background-image:
        radial-gradient(at 20% 25%, hsl(268, 80%, 40%), transparent 50%),
        radial-gradient(at 80% 10%, hsl(210, 80%, 40%), transparent 50%),
        radial-gradient(at 75% 75%, hsl(340, 80%, 50%), transparent 50%);
      filter: blur(120px);
    }
    .glass-card {
      background: rgba(15, 15, 15, 0.4);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .cta-glow {
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.3), 0 0 30px rgba(99, 102, 241, 0.2);
    }
    .auth-tab {
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      line-height: 1.25rem;
      font-weight: 500;
      color: #9ca3af;
      border-bottom-width: 2px;
      border-color: transparent;
      transition: all 0.2s ease-in-out;
    }
    .auth-tab:hover {
        color: white;
        border-color: #4f46e5;
    }
    .auth-tab.active {
      color: white;
      border-color: #6366f1;
    }
    .auth-panel.hidden {
        display: none;
    }
  </style>
</head>
<body class="text-gray-300">
  <div class="mesh-gradient"></div>
  <div class="min-h-screen flex flex-col items-center justify-center px-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="index.html">
                <img src="/logo.png" alt="ReviewResQ" class="h-12 w-auto mx-auto">
            </a>
        </div>
      <div class="glass-card rounded-2xl p-8">
        <div id="auth-container">
          <!-- Tabs -->
          <div class="mb-6 border-b border-white/10">
            <div class="flex -mb-px">
              <button class="auth-tab active" data-target="login">Login</button>
              <button class="auth-tab" data-target="signup">Sign Up</button>
              <button class="auth-tab" data-target="forgot">Forgot</button>
            </div>
          </div>

          <!-- Global message -->
          <div id="global-message" class="hidden my-4 text-center text-sm p-3 rounded-lg" role="alert"></div>

          <!-- Login Panel -->
          <section id="login-panel" class="auth-panel">
            <h2 class="text-2xl font-bold text-white text-center mb-1">Welcome Back</h2>
            <p class="text-gray-400 text-center text-sm mb-6">Enter your credentials to access your account.</p>
            <form id="login-form" class="space-y-4">
              <div class="field">
                <label for="login-email" class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                <input id="login-email" type="email" autocomplete="email" required class="w-full bg-white/5 border border-white/20 rounded-lg px-3 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                <div id="login-email-error" class="text-red-400 text-xs mt-1"></div>
              </div>
              <div class="field">
                <label for="login-password" class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                <input id="login-password" type="password" autocomplete="current-password" required class="w-full bg-white/5 border border-white/20 rounded-lg px-3 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                <div id="login-password-error" class="text-red-400 text-xs mt-1"></div>
              </div>
              <button type="submit" id="login-submit" class="w-full bg-indigo-500 text-white px-5 py-3 rounded-lg text-sm font-semibold hover:bg-indigo-600 transition-all cta-glow">Log In</button>
            </form>
          </section>

          <!-- Signup Panel -->
          <section id="signup-panel" class="auth-panel hidden">
             <h2 class="text-2xl font-bold text-white text-center mb-1">Create Account</h2>
             <p class="text-gray-400 text-center text-sm mb-6">Join us and start managing your reputation.</p>
            <form id="signup-form" class="space-y-4">
               <div class="field">
                <label for="signup-name" class="block text-sm font-medium text-gray-400 mb-1">Full Name</label>
                <input id="signup-name" type="text" autocomplete="name" required class="w-full bg-white/5 border border-white/20 rounded-lg px-3 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                <div id="signup-name-error" class="text-red-400 text-xs mt-1"></div>
              </div>
              <div class="field">
                <label for="signup-email" class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                <input id="signup-email" type="email" autocomplete="email" required class="w-full bg-white/5 border border-white/20 rounded-lg px-3 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                <div id="signup-email-error" class="text-red-400 text-xs mt-1"></div>
              </div>
              <div class="field">
                <label for="signup-password" class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                <input id="signup-password" type="password" autocomplete="new-password" required class="w-full bg-white/5 border border-white/20 rounded-lg px-3 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                <p class="text-gray-500 text-xs mt-1">At least 8 characters long.</p>
                <div id="signup-password-error" class="text-red-400 text-xs mt-1"></div>
              </div>
              <button type="submit" id="signup-submit" class="w-full bg-indigo-500 text-white px-5 py-3 rounded-lg text-sm font-semibold hover:bg-indigo-600 transition-all cta-glow">Create Account</button>
            </form>
          </section>

          <!-- Forgot Password Panel -->
          <section id="forgot-panel" class="auth-panel hidden">
            <h2 class="text-2xl font-bold text-white text-center mb-1">Reset Password</h2>
            <p class="text-gray-400 text-center text-sm mb-6">We'll send a password reset link to your email.</p>
            <form id="forgot-form" class="space-y-4">
              <div class="field">
                <label for="forgot-email" class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                <input id="forgot-email" type="email" autocomplete="email" required class="w-full bg-white/5 border border-white/20 rounded-lg px-3 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                <div id="forgot-email-error" class="text-red-400 text-xs mt-1"></div>
              </div>
              <button type="submit" id="forgot-submit" class="w-full bg-indigo-500 text-white px-5 py-3 rounded-lg text-sm font-semibold hover:bg-indigo-600 transition-all cta-glow">Send Reset Link</button>
            </form>
          </section>
        </div>
      </div>
      <div class="text-center mt-6">
          <a href="/index.html" class="text-sm text-gray-400 hover:text-white transition-colors">← Back to Home</a>
      </div>
    </div>
  </div>

  <script defer>
    const tabs = document.querySelectorAll(".auth-tab");
    const panels = document.querySelectorAll(".auth-panel");

    function clearAllMessages() {
        const globalMsg = document.getElementById("global-message");
        globalMsg.textContent = "";
        globalMsg.className = "hidden my-4 text-center text-sm p-3 rounded-lg";
        document.querySelectorAll(".text-red-400").forEach((el) => (el.textContent = ""));
    }
    
    tabs.forEach((tab) => {
      tab.addEventListener("click", (e) => {
        e.preventDefault();
        tabs.forEach(t => t.classList.remove("active"));
        panels.forEach(p => p.classList.add("hidden"));
        
        tab.classList.add("active");
        const target = tab.dataset.target;
        document.getElementById(target + "-panel").classList.remove("hidden");

        clearAllMessages();
      });
    });
  </script>

  <script type="module" src="./auth.js"></script>
</body>
</html>
