<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    document.documentElement.classList.add('rr-plan-pending');
    document.documentElement.classList.add('rr-data-pending');
  </script>
  <style>
    html.rr-plan-pending [data-rr-plan-text],
    html.rr-data-pending [data-rr-plan-text] { visibility: hidden; }
    html.rr-plan-pending .rr-plan-badge,
    html.rr-data-pending .rr-plan-badge { visibility: hidden; }
    html.rr-plan-pending [data-plan-gated],
    html.rr-data-pending [data-plan-gated] { display:none !important; }
  </style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReviewResQ – Account & Billing</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232563eb'/%3E%3Ctext x='32' y='42' font-size='32' text-anchor='middle' fill='white' font-family='Inter,%20Arial,%20sans-serif'%3ERR%3C/text%3E%3C/svg%3E"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">RR</div>
        <div class="brand-name">ReviewResQ</div>
      </div>
      <nav class="global-nav" aria-label="Dashboard navigation"></nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">Account &amp; Billing</div>
        <div class="topbar-right">
          <span class="badge" data-plan-badge data-rr-plan-text>Loading…</span>
          <button class="btn btn-link" type="button" onclick="window.location.href='auth.html'">Log out</button>
        </div>
      </header>

      <div class="page-shell">
        <header class="page-header">
          <p class="page-title">Account &amp; Billing</p>
          <p class="page-subtitle">Manage your plan details and billing info.</p>
        </header>

        <section class="card plan-summary">
          <div class="card-header">
            <div>
              <p class="card-title">Plan summary</p>
              <p class="card-subtitle" id="planSummary">Loading plan…</p>
              <div class="badge-row">
                <span class="badge badge-success" id="planStatus">Active</span>
                <span class="badge" id="planRenewal">Next renewal: —</span>
                <span class="badge badge-success" id="growthEnabledBadge" style="display:none;">Growth enabled</span>
              </div>
            </div>
            <div class="button-row">
              <button class="btn btn-primary" type="button" id="upgradeButton">Upgrade to Growth</button>
            </div>
          </div>
        </section>

        <section class="card">
          <p class="card-title">Payment method</p>
          <div class="stacked">
            <p class="strong" id="paymentMethod">Card on file</p>
            <p class="card-subtitle" id="billingEmail">billing@reviewresq.com</p>
          </div>
          <div class="button-row">
            <button class="btn btn-outline" type="button">Update card</button>
          </div>
        </section>

        <section class="card">
          <p class="card-title">Invoices</p>
          <div class="table-wrapper">
            <table class="table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Invoice</th>
                  <th>Amount</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="invoiceTable">
                <tr>
                  <td>—</td>
                  <td>—</td>
                  <td>—</td>
                  <td><span class="badge">No invoices yet</span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script type="module" src="account.js"></script>
  <script type="module" src="nav-access-init.js"></script>
  <script src="dashboard-nav.js"></script>
</body>
</html>
